name: gen3d
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: gen3d, cancel-in-progress: true }
jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/hy3dgen
            ~/.u2net
          key: hy3d-mini-v1
      - name: Install
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers "transformers==4.48.3" "diffusers==0.32.2" "huggingface_hub<0.30" accelerate einops omegaconf trimesh pymeshlab scikit-image opencv-python-headless rembg onnxruntime safetensors huggingface_hub tqdm fast-simplification
          git clone --depth 1 https://github.com/Tencent-Hunyuan/Hunyuan3D-2 hy2
      - name: Generate
        timeout-minutes: 150
        env: { PYTHONPATH: hy2 }
        run: python gen3d/gen.py
      - name: Save results
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add gen3d/out
          git commit -m "gen3d: results" || echo "nothing new"
          git push
